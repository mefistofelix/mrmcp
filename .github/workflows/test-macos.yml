name: Mac GUI Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mrmcp.js"
      - "commands.yaml"
      - "assets/**"
      - ".github/tests/tauriless-macos-probe.js"
      - ".github/tests/tauriless-probe-scheme.patch"
      - ".github/tests/tauriless-probe-sync.patch"
      - ".github/workflows/test-macos.yml"
  pull_request:
    paths:
      - "mrmcp.js"
      - "commands.yaml"
      - "assets/**"
      - ".github/tests/tauriless-macos-probe.js"
      - ".github/tests/tauriless-probe-scheme.patch"
      - ".github/tests/tauriless-probe-sync.patch"
      - ".github/workflows/test-macos.yml"

permissions:
  contents: read

jobs:
  gui-bootstrap:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out Tauriless source
        uses: actions/checkout@v4
        with:
          repository: mefistofelix/tauriless
          ref: main
          path: tauriless-src

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Show runner architecture
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          uname -m

      - name: Build async custom-protocol Tauriless
        shell: bash
        run: |
          set -euo pipefail
          git -C tauriless-src apply "$GITHUB_WORKSPACE/.github/tests/tauriless-probe-scheme.patch"
          cargo build --release --manifest-path tauriless-src/tauriless/Cargo.toml
          file tauriless-src/tauriless/target/release/libtauriless.dylib

      - name: Test async custom protocol
        shell: bash
        env:
          TAURILESS_LIBRARY_PATH: ${{ github.workspace }}/tauriless-src/tauriless/target/release/libtauriless.dylib
          TAURILESS_PROBE_URL: probe://localhost/index.html
        run: |
          set +e
          deno run --minimum-dependency-age=0 --allow-env --allow-ffi --allow-write .github/tests/tauriless-macos-probe.js
          status=$?
          set -e
          echo "Async custom-protocol probe exit: $status"

      - name: Build sync custom-protocol Tauriless
        shell: bash
        run: |
          set -euo pipefail
          git -C tauriless-src reset --hard HEAD
          git -C tauriless-src apply "$GITHUB_WORKSPACE/.github/tests/tauriless-probe-sync.patch"
          cargo build --release --manifest-path tauriless-src/tauriless/Cargo.toml
          file tauriless-src/tauriless/target/release/libtauriless.dylib

      - name: Test sync custom protocol
        shell: bash
        env:
          TAURILESS_LIBRARY_PATH: ${{ github.workspace }}/tauriless-src/tauriless/target/release/libtauriless.dylib
          TAURILESS_PROBE_URL: probe://localhost/index.html
        run: |
          set +e
          deno run --minimum-dependency-age=0 --allow-env --allow-ffi --allow-write .github/tests/tauriless-macos-probe.js
          status=$?
          set -e
          echo "Sync custom-protocol probe exit: $status"
