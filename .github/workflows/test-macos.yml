name: Mac GUI Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mrmcp.js"
      - "commands.yaml"
      - "assets/**"
      - ".github/tests/tauriless-macos-probe.js"
      - ".github/tests/tauriless-probe-scheme.patch"
      - ".github/tests/tauriless-probe-sync.patch"
      - ".github/tests/tauriless-probe-resize.patch"
      - ".github/tests/tauriless-run-loop-probe.rs"
      - ".github/workflows/test-macos.yml"
  pull_request:
    paths:
      - "mrmcp.js"
      - "commands.yaml"
      - "assets/**"
      - ".github/tests/tauriless-macos-probe.js"
      - ".github/tests/tauriless-probe-scheme.patch"
      - ".github/tests/tauriless-probe-sync.patch"
      - ".github/tests/tauriless-probe-resize.patch"
      - ".github/tests/tauriless-run-loop-probe.rs"
      - ".github/workflows/test-macos.yml"

permissions:
  contents: read

jobs:
  gui-bootstrap:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out Tauriless source
        uses: actions/checkout@v4
        with:
          repository: mefistofelix/tauriless
          ref: main
          path: tauriless-src

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Show runner architecture
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          uname -m

      - name: Build run_iteration resize diagnostic Tauriless
        shell: bash
        run: |
          set -euo pipefail
          git -C tauriless-src apply "$GITHUB_WORKSPACE/.github/tests/tauriless-probe-scheme.patch"
          git -C tauriless-src apply "$GITHUB_WORKSPACE/.github/tests/tauriless-probe-resize.patch"
          cargo build --release --manifest-path tauriless-src/tauriless/Cargo.toml
          file tauriless-src/tauriless/target/release/libtauriless.dylib

      - name: Test custom protocol after forced resize
        shell: bash
        env:
          TAURILESS_LIBRARY_PATH: ${{ github.workspace }}/tauriless-src/tauriless/target/release/libtauriless.dylib
          TAURILESS_PROBE_URL: probe://localhost/index.html
          TAURILESS_FORCE_RESIZE: "1"
        run: |
          set +e
          deno run --minimum-dependency-age=0 --allow-env --allow-ffi --allow-write .github/tests/tauriless-macos-probe.js
          status=$?
          set -e
          echo "Forced-resize probe exit: $status"

      - name: Test ordinary HTTPS navigation
        shell: bash
        env:
          TAURILESS_LIBRARY_PATH: ${{ github.workspace }}/tauriless-src/tauriless/target/release/libtauriless.dylib
          TAURILESS_PROBE_URL: https://example.com/
        run: |
          set +e
          deno run --minimum-dependency-age=0 --allow-env --allow-ffi --allow-write .github/tests/tauriless-macos-probe.js
          status=$?
          set -e
          echo "HTTPS navigation probe exit: $status"

      - name: Test native Tauri run loop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tauriless-src/tauriless/examples
          cp .github/tests/tauriless-run-loop-probe.rs tauriless-src/tauriless/examples/run_loop_probe.rs
          cargo build --release --manifest-path tauriless-src/tauriless/Cargo.toml --example run_loop_probe

          log="$RUNNER_TEMP/run-loop-probe.log"
          tauriless-src/tauriless/target/release/examples/run_loop_probe >"$log" 2>&1 &
          pid=$!
          status=124
          for second in $(seq 1 10); do
            if ! kill -0 "$pid" 2>/dev/null; then
              set +e
              wait "$pid"
              status=$?
              set -e
              break
            fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            sleep 1
            kill -9 "$pid" 2>/dev/null || true
          fi
          cat "$log"
          echo "Native run-loop probe exit: $status"
