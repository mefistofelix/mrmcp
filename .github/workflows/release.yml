name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Verify version matches tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^const VERSION = "\([^"]*\)";/\1/p' mrmcp.js)"
          test -n "$version"
          test "$version" = "$GITHUB_REF_NAME"

      - name: Check source
        run: deno check --minimum-dependency-age=0 mrmcp.js

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Build Linux x64
        run: >-
          deno compile --minimum-dependency-age=0 -A --unstable-ffi
          --target x86_64-unknown-linux-gnu
          --include assets --include commands.yaml
          --output dist/mrmcp-linux-x64
          mrmcp.js

      - name: Build macOS x64
        run: >-
          deno compile --minimum-dependency-age=0 -A --unstable-ffi
          --target x86_64-apple-darwin
          --include assets --include commands.yaml
          --output dist/mrmcp-macos-x64
          mrmcp.js

      - name: Build macOS arm64
        run: >-
          deno compile --minimum-dependency-age=0 -A --unstable-ffi
          --target aarch64-apple-darwin
          --include assets --include commands.yaml
          --output dist/mrmcp-macos-arm64
          mrmcp.js

      - name: Build Windows x64
        run: >-
          deno compile --minimum-dependency-age=0 -A --unstable-ffi
          --target x86_64-pc-windows-msvc
          --no-terminal --icon assets/mrmcp.ico
          --include assets --include commands.yaml
          --output dist/mrmcp-windows-x64.exe
          mrmcp.js

      - name: Show checksums
        shell: bash
        run: sha256sum dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            dist/mrmcp-windows-x64.exe
            dist/mrmcp-linux-x64
            dist/mrmcp-macos-x64
            dist/mrmcp-macos-arm64
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --title "MrMCP $GITHUB_REF_NAME" \
              --generate-notes
          fi
