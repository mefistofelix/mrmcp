name: Release
on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-latest, platform: win32, arch: x64, asset: mrmcp-windows-x64.exe, desktop: true}
          - {runner: ubuntu-latest, platform: linux, arch: x64, asset: mrmcp-linux-x64, desktop: true}
          - {runner: macos-15, platform: darwin, arch: arm64, asset: mrmcp-macos-arm64.dmg, desktop: true}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      ASSET: ${{ matrix.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: Verify version matches tag
        run: |
          set -euo pipefail
          version="$(sed -n 's/^const VERSION = "\([^"]*\)";/\1/p' mrmcp.js)"
          test -n "$version"
          test "$version" = "$RELEASE_TAG"
      - name: Install declared dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libx11-xcb1 libxcb1 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libvulkan1 libasound2t64 libgl1 libegl1 libxrandr2 libxtst6 libxinerama1 libxcursor1
      - name: Verify backend and native page projections
        run: bun .github/check.mjs
      - name: Verify standalone tools, TLS and semantic retrieval
        run: bun .github/check.mjs --standalone --semantic
      - name: Build portable server
        if: matrix.platform != 'darwin' || !matrix.desktop
        run: |
          mkdir -p dist
          bun .github/build.mjs "$PLATFORM" "$ARCH" "dist/$ASSET"
          if [ "$PLATFORM" != win32 ]; then chmod 755 "dist/$ASSET"; fi
      - name: Build macOS app and DMG
        if: matrix.platform == 'darwin' && matrix.desktop
        run: |
          set -euo pipefail
          app=dist/MrMCP.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          bun .github/build.mjs darwin "$ARCH" "$app/Contents/MacOS/MrMCP"
          chmod 755 "$app/Contents/MacOS/MrMCP"
          iconset=dist/MrMCP.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -s format png -z "$size" "$size" assets/mrmcp-logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -s format png -z "$double" "$double" assets/mrmcp-logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/MrMCP.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>MrMCP</string>
            <key>CFBundleExecutable</key><string>MrMCP</string>
            <key>CFBundleIconFile</key><string>MrMCP.icns</string>
            <key>CFBundleIdentifier</key><string>com.mefistofelix.mrmcp</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>MrMCP</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${RELEASE_TAG}</string>
            <key>CFBundleVersion</key><string>${RELEASE_TAG}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cat > dist/entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          xattr -cr "$app"
          codesign --force --sign - --entitlements dist/entitlements.plist "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist/dmg-root
          ditto "$app" dist/dmg-root/MrMCP.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "MrMCP $RELEASE_TAG" -srcfolder dist/dmg-root -ov -format UDZO "dist/$ASSET"
          hdiutil verify "dist/$ASSET"
          verify="$RUNNER_TEMP/mrmcp-dmg"
          mkdir -p "$verify"
          hdiutil attach -readonly -nobrowse -mountpoint "$verify" "dist/$ASSET" >/dev/null
          trap 'hdiutil detach "$verify" >/dev/null 2>&1 || true' EXIT
          plutil -lint "$verify/MrMCP.app/Contents/Info.plist"
          test -x "$verify/MrMCP.app/Contents/MacOS/MrMCP"
          test -f "$verify/MrMCP.app/Contents/Resources/MrMCP.icns"
          test -L "$verify/Applications"
          codesign --verify --deep --strict "$verify/MrMCP.app"
          hdiutil detach "$verify" >/dev/null
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish matching changelog and exactly three assets
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$RELEASE_TAG" '
            { sub(/\r$/, "") }
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\n[Complete release history](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GH_REPO" "$RELEASE_TAG" >> release-notes.md
          files=(dist/mrmcp-windows-x64.exe dist/mrmcp-linux-x64 dist/mrmcp-macos-arm64.dmg)
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for retired in mrmcp-macos-x64.dmg mrmcp-macos-x64; do gh release delete-asset "$RELEASE_TAG" "$retired" --yes >/dev/null 2>&1 || true; done
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --title "MrMCP $RELEASE_TAG" --notes-file release-notes.md
          fi
