    description: 'Library Genesis CLI for title/author/ISBN search, filtering, link resolution and mirror status. Use libgen-cli --help, search QUERY, link MD5 or status. Upstream currently publishes no release binaries: build with Go (go install github.com/anilpdv/libgen-cli@latest) and place libgen-cli.exe on Windows or libgen-cli on Unix in .mrmcp/bin. This catalog entry does not install Go or build source automatically.'
    documentation_url: 'https://github.com/anilpdv/libgen-cli'
  - logical_name: camoufox
    description: |-
      Firefox-based browser distribution. Manual full-bundle installation: download the matching OS/CPU browser ZIP from https://github.com/daijro/camoufox/releases and extract its entire contents under .mrmcp/bin/camoufox, preserving libraries, resources, fonts and the macOS app structure. Do not copy only the executable. This catalog entry intentionally has no automatic download URL because Commands currently installs one executable rather than a browser bundle. No browser download or launch happens on registration or discovery.

      Release assets are named camoufox-<version>-win.x86_64.zip, camoufox-<version>-lin.x86_64.zip, camoufox-<version>-lin.arm64.zip, camoufox-<version>-mac.x86_64.zip and camoufox-<version>-mac.arm64.zip. Consult the release page for the desired version. Once installed, invoke the logical name camoufox through exec; consult the upstream launcher documentation for automation parameters. This is a catalog entry, not an integration with MrMCP's Chromium CDP tools.
    documentation_url: 'https://github.com/daijro/camoufox/releases'
    platforms:
      windows-x86_64:
        path: camoufox/camoufox.exe
      linux-x86_64:
        path: camoufox/camoufox-bin
      linux-aarch64:
        path: camoufox/camoufox-bin
      darwin-x86_64:
        path: camoufox/Camoufox.app/Contents/MacOS/camoufox
      darwin-aarch64:
        path: camoufox/Camoufox.app/Contents/MacOS/camoufox
