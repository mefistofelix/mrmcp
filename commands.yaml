    description: 'Audio/video and subtitle downloader. For Workspace indexing, download subtitles first, for example: yt-dlp --skip-download --write-subs --write-auto-subs --sub-format vtt --sub-langs en.* --paths . URL, then use document_grep on the saved files. Supports --proxy URL, --retries and --retry-sleep; consult --help for exact arguments. Some sites require cookies, a supported JavaScript runtime such as the catalog deno command, or FFmpeg for media conversion.'
