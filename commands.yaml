  - logical_name: d2
    description: 'Modern standalone diagram scripting CLI written in Go. Prefer it for architecture, software, network and system diagrams when D2 syntax is suitable; invoke it directly with exec program d2, for example: d2 diagram.d2 diagram.svg. After rendering, call publish with path diagram.svg and mime_type image/svg+xml to request the sandboxed MCP App preview. The executable is expected to already exist as .mrmcp/bin/d2 or d2.exe; this catalog entry intentionally has no download URL.'
    documentation_url: 'https://d2lang.com/tour/intro/'
  - logical_name: mermaid
    path: arielc
    description: 'Preferred native Mermaid renderer for diagrams and chart-like Mermaid formats. Rust standalone CLI with no Node.js, browser or Puppeteer dependency; render .mmd input to SVG using exec program mermaid, for example: mermaid -i diagram.mmd -o diagram.svg, then call publish with path diagram.svg and mime_type image/svg+xml to request the sandboxed MCP App preview. Supports Mermaid flowcharts, sequence/class/state/ER/C4 diagrams, mind maps, timelines, Gantt, pie, XY charts, Sankey, radar and other supported Mermaid types.'
    documentation_url: 'https://github.com/rinfimate/ariel-rs-cli'
    platforms:
      windows-x86_64:
        download_url: 'https://github.com/rinfimate/ariel-rs-cli/releases/download/v0.2.0/arielc-windows-x86_64.zip'
      linux-x86_64:
        download_url: 'https://github.com/rinfimate/ariel-rs-cli/releases/download/v0.2.0/arielc-linux-x86_64.tar.gz'
      darwin-x86_64:
