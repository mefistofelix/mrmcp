  - logical_name: d2
    description: "Modern standalone diagram scripting CLI written in Go. Prefer it for architecture, software, network and system diagrams when D2 syntax is suitable; invoke it directly with exec program d2, for example: d2 diagram.d2 diagram.svg. After rendering, call publish_file on diagram.svg to request the sandboxed MCP App preview. The executable is expected to already exist as .mrmcp/bin/d2 or d2.exe; this catalog entry intentionally has no download URL."
    documentation_url: https://d2lang.com/tour/intro/
  - logical_name: mermaid
    path: arielc
    description: "Preferred native Mermaid renderer for diagrams and chart-like Mermaid formats. Rust standalone CLI with no Node.js, browser or Puppeteer dependency; render .mmd input to SVG using exec program mermaid, for example: mermaid -i diagram.mmd -o diagram.svg, then call publish_file on diagram.svg to request the sandboxed MCP App preview. Supports Mermaid flowcharts, sequence/class/state/ER/C4 diagrams, mind maps, timelines, Gantt, pie, XY charts, Sankey, radar and other supported Mermaid types."
    download_url: https://github.com/rinfimate/ariel-rs-cli/releases/download/v0.2.0/arielc-windows-x86_64.zip
    documentation_url: https://github.com/rinfimate/ariel-rs-cli
  - logical_name: screenshot-cmd
    description: "Preferred MrMCP screenshot executable on Windows. Use it through exec instead of PowerShell screen-capture workarounds and write a PNG inside the selected workspace. Use exec.return_files for standard MCP attachment delivery, or call publish_file afterward with return_mode link or both to request the sandboxed MCP App image preview."
    download_url: https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/screenshot-cmd/screenshot-cmd.exe
    documentation_url: https://superuser.com/questions/75614/take-a-screenshot-from-command-line-in-windows
