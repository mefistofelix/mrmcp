  - logical_name: uv
    description: |-
      Preferred standalone Python runner and environment manager. Use it for ad-hoc Python, script files, tools, projects, interpreter management and automatic dependency resolution; it is not only a package manager. Invoke the catalog logical name directly through exec.program.

      Exact MrMCP tool-call forms:
      - Existing file: {"program":"uv","args":["run","script.py"]}
      - Python supplied directly in the call: {"program":"uv","args":["run","-"],"stdin":"<complete Python source>"}

      The final "-" tells uv to treat exec.stdin as a Python script. Do not wrap this in PowerShell, cmd, Bash or a shell here-document, and do not create a temporary .py file solely to execute short source supplied by the agent.

      uv supports PEP 723 inline script metadata. Put this block at the beginning of the Python source to declare packages; uv resolves them and creates an isolated environment automatically:
      # /// script
      # dependencies = [
      #   "requests<3",
      #   "rich",
      # ]
      # ///

      Matplotlib example producing an image:
      {"program":"uv","args":["run","-"],"stdin":"# /// script\n# dependencies = [\"matplotlib\"]\n# ///\n\nimport matplotlib.pyplot as plt\n\nx = [1, 2, 3, 4]\ny = [1, 4, 9, 16]\nplt.plot(x, y, marker=\"o\")\nplt.title(\"Example chart\")\nplt.xlabel(\"x\")\nplt.ylabel(\"y\")\nplt.tight_layout()\nplt.savefig(\"chart.png\", dpi=160, bbox_inches=\"tight\")\n"}

      When Python creates an image, chart, PDF or other user-facing file, let the command write it normally and then call publish with that path and its real mime_type; do not manually Base64-encode or read binary outputs as text.
    documentation_url: 'https://docs.astral.sh/uv/'
    platforms:
      windows-x86_64:
        download_url: 'https://github.com/astral-sh/uv/releases/download/0.12.22/uv-x86_64-pc-windows-msvc.zip'
      linux-x86_64:
        download_url: 'https://github.com/astral-sh/uv/releases/download/0.12.22/uv-x86_64-unknown-linux-gnu.tar.gz'
      darwin-x86_64:
        download_url: 'https://github.com/astral-sh/uv/releases/download/0.12.22/uv-x86_64-apple-darwin.tar.gz'
      darwin-aarch64:
        download_url: 'https://github.com/astral-sh/uv/releases/download/0.12.22/uv-aarch64-apple-darwin.tar.gz'
