    description: 'Preferred source-exploration and code-navigation CLI for unfamiliar repositories, backed by tree-sitter and a local incrementally refreshed SQLite index. Start with `cymbal investigate <symbol>` for an adaptive source/callers/impact view. Prefer `cymbal search` before raw grep, and `cymbal outline` / `cymbal show` before broad file reads. Use `cymbal trace` for downward dependencies, `cymbal impact` for upstream blast radius, and `cymbal changed` to understand the impact of the current Git diff. Add `--graph` when topology matters and `--json` when machine-structured output is preferable.'
    documentation_url: 'https://github.com/1broseidon/cymbal'
    platforms:
